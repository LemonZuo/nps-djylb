<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5><span id="langtag"></span><span></span></h5>
                    <div class="ibox-tools">
                        <a class="collapse-link">
                            <i class="fa fa-chevron-up"></i>
                        </a>
                        <a class="close-link">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                </div>
                <div class="content">
                    <div class="table-responsive">
                        <div id="toolbar">
                            {{ if or (not .type) (ne .type "file") }}
                            <a class="btn btn-primary dim" href="{{.web_base_url}}/index/add?type={{.type}}&client_id={{.client_id}}">
                                <i class="fa fa-fw fa-lg fa-plus"></i>
                                <span langtag="word-add"></span>
                            </a>
                            {{ end }}
                        </div>
                        <table class="table-striped table-hover" data-mobile-responsive="true" id="taskList_table"></table>
                    </div>
                </div>
                <div class="ibox-content">
                    <table id="table"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addressModal" tabindex="-1" role="dialog" aria-labelledby="addressModalLabel" aria-hidden="true" data-backdrop="true" data-keyboard="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addressModalLabel" langtag="word-accessaddress"></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body" id="addressModalBody"></div>
        </div>
    </div>
</div>

<style>
    /* 让 dialog 按内容收缩，避免大屏下整张弹窗过宽 */
    #addressModal .modal-dialog { max-width: min(720px, 92vw) !important; width: fit-content; min-width: 360px; margin: 1.75rem auto !important; }
    #addressModal .modal-content { width: 100%; }
    #addressModal .modal-header { padding: 12px 20px; border-bottom: 1px solid #e7eaec; display: flex; align-items: center; }
    #addressModal .modal-title { margin: 0; font-size: 16px; font-weight: 600; }
    #addressModal .modal-header .close { margin: 0 0 0 16px; padding: 0; font-size: 22px; line-height: 1; }
    #addressModal .modal-body { padding: 12px 20px; }
    #addressModal .addr-row { display: flex; align-items: center; padding: 8px 0; gap: 10px; }
    #addressModal .addr-row + .addr-row { border-top: 1px solid #f0f0f0; }
    #addressModal .addr-label { flex: 0 0 auto; min-width: 64px; text-align: center; font-size: 11px; padding: 4px 8px; }
    #addressModal .addr-code { flex: 0 1 auto; background: #f7f9fa; color: #2f4050; padding: 6px 10px; border-radius: 3px; word-break: break-all; font-family: Menlo, Consolas, monospace; font-size: 13px; border: 1px solid #e7eaec; }
    #addressModal .addr-copy { flex: 0 0 auto; }
</style>

<script>
    function getTooltipText(key) {
        var lang = $('#languagemenu').attr('lang') || 'zh-CN';
        if (key === 'word-copyhttpproxy') {
            return lang === 'en-US' ? 'Click to copy HTTP proxy address' : '点击复制HTTP代理地址';
        } else if (key === 'word-copysocks5proxy') {
            return lang === 'en-US' ? 'Click to copy SOCKS5 proxy address' : '点击复制SOCKS5代理地址';
        } else if (key === 'word-copyaddress') {
            return lang === 'en-US' ? 'Click to copy address' : '点击复制地址';
        } else if (key === 'word-viewaddresses') {
            return lang === 'en-US' ? 'View access addresses' : '查看访问地址';
        } else if (key === 'word-copy') {
            return lang === 'en-US' ? 'Copy' : '复制';
        }
        return '';
    }

    function showAddressModal(btn) {
        var items;
        try { items = JSON.parse($(btn).attr('data-addresses') || '[]'); } catch (e) { items = []; }
        var html = items.map(function (it) {
            return '<div class="addr-row">'
                + '<span class="label label-primary addr-label">' + escapeHtml(it.label) + '</span>'
                + '<code class="addr-code">' + escapeHtml(it.display) + '</code>'
                + '<button type="button" class="btn btn-sm btn-default addr-copy address-copy-btn" data-copy="' + escapeHtml(it.copy) + '" title="' + getTooltipText('word-copy') + '"><i class="fa fa-copy"></i></button>'
                + '</div>';
        }).join('');
        var $modal = $('#addressModal');
        if (!$modal.data('moved')) {
            $modal.appendTo('body').data('moved', true);
        }
        var $body = $('#addressModalBody');
        $body.html(html || '<div class="text-center text-muted">-</div>');
        $body.off('click', '.address-copy-btn').on('click', '.address-copy-btn', function (e) {
            e.preventDefault();
            copyAddressText($(this).attr('data-copy'));
        });
        $modal.modal('show');
    }

    function copyAddressText(text) {
        var value = text == null ? '' : String(text);
        var ok = function () { showMsg(langreply('Copied')); };
        var ng = function () { showMsg(langreply('Copied'), 'error'); };
        if (navigator.clipboard && navigator.clipboard.writeText && (window.isSecureContext || location.protocol === 'https:')) {
            navigator.clipboard.writeText(value).then(ok).catch(function () {
                copyAddressLegacy(value) ? ok() : ng();
            });
        } else {
            copyAddressLegacy(value) ? ok() : ng();
        }
    }
    function copyAddressLegacy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        try { ta.setSelectionRange(0, text.length); } catch (e) {}
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
    }

    name = '{{.name}}:'.replace(/\s*/g, "")
    $('#langtag').attr('langtag', 'page-list' + name.replace(/:.*/, "")).next().text(name.split(":")[1])

    /*bootstrap table*/
    $('#table').bootstrapTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/index/gettunnel", // 服务器数据的加载地址
        queryParams: function (params) {
            return {
                "offset": params.offset,
                "limit": params.limit,
                "type": {{.type}},
                "client_id": {{.client_id}},
                "search": params.search,
                "sort": params.sort,
                "order": params.order
            }
        },
        search: true,
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true, //分页
        sidePagination: 'server', //服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50, 100, 'all'],
        cookie: true,
        cookieIdTable: '{{.type}}',
        cookieStorage: 'localStorage',
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        onExpandRow: function () { $('body').setLang('.detail-view'); },
        onLoadSuccess:function (data) { $('body').setLang('.detail-view'); },
        onPostBody: function (data) { if ($(this)[0].locale != undefined ) $('body').setLang('#table'); },
        detailFormatter: function (index, row, element) {
            proxyprotocol = ''
            if (row.Mode == "tcp" || row.Mode == "udp") {
                proxyprotocol = '<b langtag="word-proxyprotocoltitle"></b>: <span langtag="word-proxyprotocolv' + row.Target.ProxyProtocol + '"></span>&emsp;'
            }
            tmp = '<b langtag="word-exportflow"></b>: <span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})">' + changeunit(row.Flow.ExportFlow) + '</span>&emsp;'
                + '<b langtag="word-inletflow"></b>: <span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})">' + changeunit(row.Flow.InletFlow) + '</span>&emsp;'
                + '<b langtag="word-crypt"></b>: <span langtag="word-' + row.Client.Cnf.Crypt + '"></span>&emsp;'
                + '<b langtag="word-compress"></b>: <span langtag="word-' + row.Client.Cnf.Compress + '"></span>&emsp;'
                + proxyprotocol
                + '<b langtag="word-ishttp"></b>: <span langtag="word-' + row.IsHttp + '"></span>&emsp;<br/><br>'
                + '<b langtag="word-flowlimit"></b>: <span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow_limit\'})">' + row.Flow.FlowLimit + 'MB</span>&emsp;'
                + '<b langtag="word-timelimit"></b>: <span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'time_limit\'})">' + row.Flow.TimeLimit + '</span>&emsp;'
            if (row.Mode == "mixProxy") {
                // 0=off, 1=whitelist, 2=blacklist
                var destMode = Number(row.DestAclMode || 0)
                var rulesRaw = row.DestAclRules ? String(row.DestAclRules) : ""
                var rulesText = rulesRaw ? escapeHtml(rulesRaw).replace(/\r\n/g, "\n").replace(/\n/g, "<br/>") : ""
                var modeSpan = ''
                if (destMode === 1) {
                    modeSpan = '<span langtag="word-whitelist"></span>'
                } else if (destMode === 2) {
                    modeSpan = '<span langtag="word-blacklist"></span>'
                } else {
                    modeSpan = '<span langtag="word-disable"></span>'
                }
                var destAclInfo = '<b langtag="word-destacl"></b>: ' + modeSpan + '&emsp;'
                if (destMode !== 0) {
                    destAclInfo += '<br/><br><b langtag="word-destaclrules"></b>: '
                    if (rulesText) {
                        destAclInfo += '<span>' + rulesText + '</span>&emsp;'
                    } else {
                        destAclInfo += '<span langtag="word-empty"></span>&emsp;'
                    }
                }
                return tmp + "<br/><br>"
                    + '<b langtag="word-basicusername"></b>: ' + row.Client.Cnf.U + '&emsp;'
                    + '<b langtag="word-basicpassword"></b>: ' + row.Client.Cnf.P + '&emsp;<br/><br>'
                    + '<b langtag="word-auth"></b>: ' + (row.UserAuth && row.UserAuth.Content ? row.UserAuth.Content : '') + '&emsp;<br/><br>'
                    + destAclInfo + '<br/><br>'
            }
            if (row.Mode == "file") {
                return tmp + "<br/><br>"
                    + '<b langtag="word-localpath"></b>: ' + row.LocalPath + '&emsp;'
                    + '<b langtag="word-stripprefix"></b>: ' + row.StripPre + '&emsp;<br/><br>'
                    + '<b langtag="word-target"></b>: <span onclick="oCopy(this)">' + row.Target.TargetStr + '</span>&emsp;'
            }
            if (row.Mode == "p2p") {
                return tmp + "<br/><br>"
                    + '<b langtag="word-commandaccessp2p"></b>: ' + '<code onclick="oCopy(this)">' + "./npc{{.win}} -server=\"{{.addr}}\" -vkey=\"" + row.Client.VerifyKey
                    + "\" -type=\"" + {{.bridgeType}} + "\" -password=\"" + row.Password + "\" -target=\"" + row.Target.TargetStr + "\" -target_type=\"" + row.TargetType + "\"</code>" + "<br/><br>"
                    + '<b langtag="word-commandaccessp2ps"></b>: ' + '<code onclick="oCopy(this)">' + "./npc{{.win}} -server=\"{{.addr}}\" -vkey=\"" + row.Client.VerifyKey
                    + "\" -type=\"" + {{.bridgeType}} + "\" -password=\"" + row.Password + "\" -local_type=\"p2ps\" -fallback_secret=\"{{if .allow_secret_link}}true{{else}}false{{end}}\"" + "</code>" + "<br/><br>"
                    + '<b langtag="word-commandaccessp2pt"></b>: ' + '<code onclick="oCopy(this)">' + "./npc{{.win}} -server=\"{{.addr}}\" -vkey=\"" + row.Client.VerifyKey
                    + "\" -type=\"" + {{.bridgeType}} + "\" -password=\"" + row.Password + "\" -local_type=\"p2pt\" -fallback_secret=\"{{if .allow_secret_link}}true{{else}}false{{end}}\"" + "</code>"
            }
            if (row.Mode == "secret") {
                return tmp + "<br/><br>" + '<b langtag="word-commandaccess"></b>: ' + '<code onclick="oCopy(this)">' + "./npc{{.win}} -server=\"{{.addr}}\" -vkey=\"" + row.Client.VerifyKey
                    + "\" -type=\"" + {{.bridgeType}} + "\" -password=\"" + row.Password + "\" -target_type=\"" + row.TargetType + "\" -local_type=\"secret\"" + "</code>"
            }
            return tmp
        },
        // 表格的列
        columns: [
            {
                field: 'Id', //域值
                title: '<span langtag="word-id"></span>', //标题
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {
                field: 'Client.Id', //域值
                title: '<span langtag="word-clientid"></span>', //标题
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    var text = row.Client.Remark ? (row.Client.Id + ' · ' + row.Client.Remark) : row.Client.Id
                    return '<span onclick="copyText(\'' + row.Client.VerifyKey + '\')">' + text + '</span>'
                }
            },
            {
                field: 'Remark', //域值
                title: '<span langtag="word-remark"></span>', //标题
                halign: 'center',
                visible: false, //false表示不显示
                sortable: false, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {
                field: 'Client.VerifyKey', //域值
                title: '<span langtag="word-verifykey"></span>', //标题
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {{ if not .type }}
            {
                field: 'Mode', //域值
                title: '<span langtag="word-scheme"></span>', //标题
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span langtag="scheme-' + value + '"></span>'
                }
            },
            {{ end }}
            {
                field: 'Port', //域值
                title: '<span langtag="word-port"></span>', //标题
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {{ if or (not .type) (eq .type "tcp") (eq .type "udp") (eq .type "mixProxy") }}
            {
                field: 'AccessAddress',
                title: '<span langtag="word-accessaddress"></span>',
                halign: 'center',
                align: 'center',
                visible: true,
                sortable: false,
                formatter: function (value, row, index) {
                    var items = [];
                    if (row.Mode == 'tcp' || row.Mode == 'udp') {
                        var address = '{{.ip}}:' + row.Port;
                        items.push({label: String(row.Mode).toUpperCase(), display: address, copy: address});
                    } else if (row.Mode == 'mixProxy') {
                        var auth = '';
                        if (row.Client && row.Client.Cnf && row.Client.Cnf.U && row.Client.Cnf.P) {
                            auth = row.Client.Cnf.U + ':' + row.Client.Cnf.P + '@';
                        }
                        if (row.HttpProxy) {
                            items.push({label: 'HTTP', display: 'http://{{.ip}}:' + row.Port, copy: 'http://' + auth + '{{.ip}}:' + row.Port});
                        }
                        if (row.Socks5Proxy) {
                            items.push({label: 'SOCKS5', display: 'socks5://{{.ip}}:' + row.Port, copy: 'socks5://' + auth + '{{.ip}}:' + row.Port});
                        }
                    }
                    if (items.length === 0) return '';
                    var data = escapeHtml(JSON.stringify(items));
                    return '<button type="button" class="btn btn-xs btn-primary" onclick="showAddressModal(this)" data-addresses="' + data + '" title="' + getTooltipText('word-viewaddresses') + '"><i class="fa fa-link"></i> ' + items.length + '</button>';
                }
            },
            {{ end }}
            {{ if or (not .type) (eq .type "tcp") (eq .type "udp") (eq .type "secret") (eq .type "p2p") }}
            {
                field: 'Target.TargetStr', //域值
                title: '<span langtag="word-target"></span>', //标题
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {{ end }}
            {{ if or (not .type) (eq .type "secret") (eq .type "p2p") }}
            {
                field: 'TargetType', //域值
                title: '<span langtag="word-targettype"></span>', //标题
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + String(value).toUpperCase() + '</span>'
                }
            },
            {
                field: 'Password', //域值
                title: '<span langtag="word-identificationkey"></span>', //标题
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {{ end }}
            {{ if and .type (eq .type "file") }}
            {
                field: 'LocalPath', //域值
                title: '<span langtag="word-localpath"></span>', //标题
                halign: 'center',
                visible: true //false表示不显示
            },
            {
                field: 'StripPre', //域值
                title: '<span langtag="word-stripprefix"></span>', //标题
                halign: 'center',
                visible: true //false表示不显示
            },
            {{ end }}
            {{ if and .type (eq .type "mixProxy") }}
            {
                field: 'HttpProxy', //域值
                title: '<span langtag="word-httpproxy"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    btn_group = '<div class="btn-group">'
                    if (value) {
                        btn_group += '<a onclick="submitform(\'stop\', \'{{.web_base_url}}/index/stop\', {\'id\':' + row.Id + ', \'mode\': \'http\'})" class="btn btn-outline btn-warning"><i class="fa fa-pause"></i></a>'
                    } else {
                        btn_group += '<a onclick="submitform(\'start\', \'{{.web_base_url}}/index/start\', {\'id\':' + row.Id + ', \'mode\': \'http\'})" class="btn btn-outline btn-primary"><i class="fa fa-play"></i></a>'
                    }
                    btn_group += '</div>'
                    return btn_group

                }
            },
            {
                field: 'Socks5Proxy', //域值
                title: '<span langtag="word-socks5proxy"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    btn_group = '<div class="btn-group">'
                    if (value) {
                        btn_group += '<a onclick="submitform(\'stop\', \'{{.web_base_url}}/index/stop\', {\'id\':' + row.Id + ', \'mode\': \'socks5\'})" class="btn btn-outline btn-warning"><i class="fa fa-pause"></i></a>'
                    } else {
                        btn_group += '<a onclick="submitform(\'start\', \'{{.web_base_url}}/index/start\', {\'id\':' + row.Id + ', \'mode\': \'socks5\'})" class="btn btn-outline btn-primary"><i class="fa fa-play"></i></a>'
                    }
                    btn_group += '</div>'
                    return btn_group
                }
            },
            {{ end }}
            {
                field: 'InletFlow', //域值
                title: '<span langtag="word-inletflow"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})">' + changeunit(row.Flow.InletFlow) + '</span>'
                }
            },
            {
                field: 'ExportFlow', //域值
                title: '<span langtag="word-exportflow"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})">' + changeunit(row.Flow.ExportFlow) + '</span>'
                }
            },
            {
                field: 'TotalFlow', //域值
                title: '<span langtag="word-totalflow"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})">' + changeunit(row.Flow.InletFlow + row.Flow.ExportFlow) + '</span>'
                }
            },
            {
                field: 'FlowRemain', //域值
                title: '<span langtag="word-flowremain"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (row.Flow.FlowLimit === 0) {
                        return '∞'
                    }
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow_limit\'})">' + changeunit(row.Flow.FlowLimit*1024*1024 - row.Flow.InletFlow - row.Flow.ExportFlow) + '</span>'
                }
            },
            {
                field: 'TimeRemain', //域值
                title: '<span langtag="word-timeremain"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'time_limit\'})">' + getRemainingTime(row.Flow.TimeLimit).formatted + '</span>'
                }
            },
            {
                field: 'Flow.FlowLimit', //域值
                title: '<span langtag="word-flowlimit"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (value === 0) {
                        return '<span langtag="word-false"></span>'
                    }
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow_limit\'})">' + changeunit(value * 1024 * 1024) + '</span>'
                }
            },
            {
                field: 'Flow.TimeLimit', //域值
                title: '<span langtag="word-timelimit"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (value === "0001-01-01T00:00:00Z") {
                        return '<span langtag="word-false"></span>'
                    }
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'time_limit\'})">' + value + '</span>'
                }
            },
            {
                field: 'NowConn', //域值
                title: '<span langtag="word-nowconn"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {
                field: 'Status', //域值
                title: '<span langtag="word-status"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'RunStatus', //域值
                title: '<span langtag="word-runstatus"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (value) {
                        if (row.Mode && row.Mode == "tcp") {
                            return '<a href="' + 'http://{{.ip}}:' + row.Port + '" target="_blank"><span class="badge badge-primary" langtag="word-open"></span></a>'
                        } else {
                            return '<span class="badge badge-primary" langtag="word-open"></span>'
                        }
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'Client.IsConnect', //域值
                title: '<span langtag="word-clientstatus"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (value) {
                        if (row.Mode && row.Mode == "tcp") {
                            return '<a href="' + (row.IsHttp ? 'http://' : 'https://') + '{{.ip}}:' + row.Port + '" target="_blank"><span class="badge badge-primary" langtag="word-online"></span></a>'
                        } else {
                            return '<span class="badge badge-primary" langtag="word-online"></span>'
                        }
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                field: 'option', //域值
                title: '<span langtag="word-option"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: true, //false表示不显示
                formatter: function (value, row, index) {
                    btn_group = '<div class="btn-group">'
                    if (row.Status) {
                        btn_group += "<a onclick=\"submitform('stop', '{{.web_base_url}}/index/stop', {'id':" + row.Id
                        btn_group += '})" class="btn btn-outline btn-warning"><i class="fa fa-pause"></i></a>'
                    } else {
                        btn_group += "<a onclick=\"submitform('start', '{{.web_base_url}}/index/start', {\'id\':" + row.Id
                        btn_group += '})" class="btn btn-outline btn-primary"><i class="fa fa-play"></i></a>'
                    }
                    btn_group += "<a onclick=\"submitform('delete', '{{.web_base_url}}/index/del', {'id':" + row.Id
                    btn_group += '})" class="btn btn-outline btn-danger"><i class="fa fa-trash"></i></a>'
                    if (row.Mode && row.Mode !== "file") {
                        btn_group += '<a href="{{.web_base_url}}/index/edit?id=' + row.Id + '" class="btn btn-outline btn-success"><i class="fa fa-edit"></i></a>'
                    }
                    btn_group += '</div>'
                    return btn_group
                }
            }
        ]
    });
</script>
