name: Docker-Mod

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-binaries:
    name: Build ${{ matrix.image }} linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [nps, npc]
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build ${{ matrix.image }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p build
          go build -trimpath -ldflags="-w -s -extldflags -static" \
            -o build/${{ matrix.image }}-${{ matrix.arch }} \
            ./cmd/${{ matrix.image }}
          file build/${{ matrix.image }}-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.image }}-${{ matrix.arch }}
          path: build/${{ matrix.image }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Build & push ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs:
      - build-binaries
    strategy:
      fail-fast: false
      matrix:
        image: [nps, npc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set env
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"
          echo "GITHUB_ACTOR_LOWER=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download ${{ matrix.image }} binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-${{ matrix.image }}-*
          path: bin-download
          merge-multiple: true

      - name: Prepare docker context
        run: |
          set -euo pipefail
          mkdir -p docker-context/bin
          cp bin-download/${{ matrix.image }}-amd64 docker-context/bin/${{ matrix.image }}-amd64
          cp bin-download/${{ matrix.image }}-arm64 docker-context/bin/${{ matrix.image }}-arm64
          chmod +x docker-context/bin/*
          if [ "${{ matrix.image }}" = "nps" ]; then
            mkdir -p docker-context/web docker-context/conf
            cp -r web/static docker-context/web/
            cp -r web/views docker-context/web/
            cp conf/nps.conf docker-context/conf/nps.conf
            cp .github/docker/entrypoint_nps.sh docker-context/entrypoint_nps.sh
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: ./.github/docker/Dockerfile.${{ matrix.image }}.slim
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/djylb-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/djylb-${{ matrix.image }}:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ env.GITHUB_ACTOR_LOWER }}/djylb-${{ matrix.image }}:latest
            ghcr.io/${{ env.GITHUB_ACTOR_LOWER }}/djylb-${{ matrix.image }}:${{ env.RELEASE_VERSION }}
